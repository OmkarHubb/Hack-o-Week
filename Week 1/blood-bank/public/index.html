<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood Bank Management System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #333; padding: 8px; text-align: left; }
    th { background-color: #c0392b; color: #fff; }
    form { margin-bottom: 20px; }
    input, select, button { margin: 4px; padding: 6px; }
    .btn-edit { background: #2980b9; color: #fff; border: none; padding: 5px 10px; cursor: pointer; }
    .btn-delete { background: #c0392b; color: #fff; border: none; padding: 5px 10px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🩸 Blood Bank Management System</h1>

  <!-- Donor Form -->
  <form id="donorForm">
    <input type="hidden" id="donorId" />
    <input type="text" id="name" placeholder="Name" required />
    <input type="number" id="age" placeholder="Age" required />
    <select id="bloodGroup" required>
      <option value="">Blood Group</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>
    <input type="text" id="phone" placeholder="Phone" required />
    <input type="text" id="city" placeholder="City" required />
    <input type="number" id="unitsAvailable" placeholder="Units Available" required />
    <br />
    <button type="submit" id="submitBtn">Add Donor</button>
    <button type="button" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
  </form>

  <!-- Donor Table -->
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Blood Group</th>
        <th>Phone</th>
        <th>City</th>
        <th>Units</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="donorTable"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
